# Fail-closed: any match marks every component affected.
global_paths = [
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "docker-compose.dev.yml",
  "deploy/**",
]

[project]
id = "sdr-platform"
repository = "Rubens-Marques/SDR-Plataform"

[components.design_system]
paths = ["design-system/**"]
checks = ["biome", "vitest"]
images = []

[components.web]
paths = ["apps/web/**"]
depends_on = ["design_system"]
checks = ["biome", "typecheck-web", "vitest-web", "playwright-web"]
images = ["web"]
dockerfile = "apps/web/Dockerfile"
context = "."

[components.server]
paths = ["apps/server/**"]
exclude = [
  "apps/server/Dockerfile.figma-worker",
  "apps/server/figma-plugin/**",
]
checks = ["biome", "typecheck-server", "vitest-server", "trivy-source"]
images = ["server"]
dockerfile = "apps/server/Dockerfile"
context = "."

[components.figma_worker]
paths = [
  "apps/server/Dockerfile.figma-worker",
  "apps/server/src/**/figma/**",
  "apps/server/figma-plugin/**",
]
checks = ["trivy-source"]
images = ["figma-worker"]
dockerfile = "apps/server/Dockerfile.figma-worker"
context = "."

[frontend]
base_url = "http://127.0.0.1:3000"
readiness_url = "http://127.0.0.1:3000"
visual_paths = ["apps/web/**"]

[frontend.dev_server]
command = ["npm", "run", "dev", "-w", "apps/web"]
timeout_seconds = 60

[frontend.playwright]
video = false

[[frontend.viewports]]
name = "desktop"
width = 1280
height = 800

[[frontend.viewports]]
name = "mobile"
width = 390
height = 844

[[frontend.routes]]
path = "/"
name = "home"
